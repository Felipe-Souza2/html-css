<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos com HTML5</title>
</head>
<body>
 <h1>Inserindo videos hospedados localmente</h1>
 <p>Este video esta hospedado no meu proprio servidor.</p>
 <video  width="560" poster="imagens/mar.png" controls autoplay loop>
  <source src="media/Videomarwebm.mkv" type="video/mkv">
  <source src="media/Videomar.mp4" type="video/mp4">
  <source src="media/Videomaror.mp4" type="video/mp4">
  <p>Seu navegador nao tem compatibilidade com reproducao de videos. </p>
 </video>
 <h1>Inserindo video do Youtube</h1>
<iframe width="560" height="315" src="https://www.youtube.com/embed/uVzT6D-yhZg?si=srKJSPcLsx4x1JWB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
