<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fontes Externas</title>
  <style>
    @font-face {
      font-family: 'house';
      src: url('fontes/Love\ House.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'love';
      src: url('fontes/love\ story\ ttf.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    h1 {
      font-family: 'love','house','Times New Roman', Times, serif;
      font-size: 3em;
      font-weight: normal;
    }
  </style>
</head>
<body>

</html>
