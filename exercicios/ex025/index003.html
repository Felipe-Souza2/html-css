<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario 3</title>
</head>
<body>
  <h1>Teste de Formulario</h1>
  <form action="cadastro.php" method="post" autocomplete="on">
    <p><label for="iname">Nome:</label>
    <input type="text" name="name" id="iname" required maxlength="30" placeholder="Nome Completo" autocomplete="name">
    </p>
      <p>
      <label for="imedia" required >Media</label>
      <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0a 10" step="0.1" value="6" required>
    </p>
    <p>
      <label for="imes">Periodo letivo</label>
      <input type="month" name="mes" id="imes" value="2026-07" required >
    </p>
    <p>
      <label for="idia">Data da Prova</label>
      <input type="date" name="dia" id="idia" required value="2026-07-03">
    </p>
    <p>
      <label for="ihora">Horario da Prova</label>
      <input type="time" name="hora" id="ihors" value="15:20">
    </p>
    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>

  </form>
</body>
</html>
