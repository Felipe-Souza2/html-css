<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario 4</title>
</head>
<body>
  <h1>Testando Formulario</h1>
  <form action="cadastro.php"  method="post" autocomplete="on">
    <fieldset>
      <legend>Dados Pessoais</legend>
      <p>
        <label for="iname">Nome:</label>
        <input type="text" name="name" id="iname" required minlength="5" maxlength="30" placeholder="Jose da Silva">
      </p>
      <p>
        <label for="iemail">E-mail:</label>
        <input type="email" name="email" id="iemail" required placeholder="joaosouza@gmail.com" autocomplete="email">
      </p>
      <p>
        <label for="iphone">Telefone:</label>
        <input type="tel" name="phone" id="iphone" required autocomplete="tel" pattern="^\(\d{2}\)\d{5}-\d{4}$" placeholder="(xx)xxxxx-xxxx">
      </p>
    </fieldset>
    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>

  </form>
  
</body>
</html>
