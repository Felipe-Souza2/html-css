<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>desafio</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    table {
      width: 500px;
      border-collapse: collapse;
    }

    .tipo {
      background-color: white;
      color: black;
     }


    th {
      background-color: gray;
      color: white;
    }

    td, th{
      border: 1px solid black;
      padding: 10px;
      text-align: center;
      
     }

  </style>
</head>
<body>
  <table>
    <thead>
      <th rowspan="2" scope="col">Area</th>
      <th rowspan="2" scope="col">Disciplina</th>
      <th colspan="2" scope="colgroup">Notas</th>
      <th rowspan="2" scope="row">Media</th>
      <tr>
        <th>Nota 1</th>
        <th>Nota 2</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th class="tipo" rowspan="4" scope="rowgroup">Exatas</th>
        <td>Matematica</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <td>Fisica</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <td>Quimica</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <td>Biologia</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <th style="text-align: left;" colspan="4" scope="col">Medias de Exatas</th>
        <th>0.0</th>
      </tr>
      <tr>
        <th class="tipo" rowspan="2" scope="rowgroup">Humanas</th>
        <td>Historia</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <td>Geografia</td>
        <td>0.0</td> 
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <th style="text-align: left;" colspan="4" scope="col">Medias de Humanas</th>
        <th>0.0</th>
      </tr>
    </tbody>
  </table>
  
</body>
</html>
